<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>F1ライン分析</title>
<style>
:root{
  --bg:#f3f4f1; --panel:#ffffff; --ink:#1b1f1d; --muted:#626b66; --line:#d9ddd8;
  --accent:#0d6b4f; --accent-soft:#e1efe9; --hot:#c2410c; --hot-soft:#fbe9df; --warn:#a16207; --me:#7c3aed;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --f-num:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121614; --panel:#1b201e; --ink:#e7ebe8; --muted:#9aa39e; --line:#2e3532;
  --accent:#4cc49a; --accent-soft:#163a2e; --hot:#fb8a50; --hot-soft:#3d2216; --warn:#e0b44a; --me:#b794f6; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;padding-top:env(safe-area-inset-top,0px)}
.phone{max-width:480px;margin:0 auto;padding:12px max(12px,env(safe-area-inset-right,0px)) 96px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:baseline;gap:8px}
h1{font-size:1.15rem;margin:0}
h2{font-size:.95rem;margin:0}
h3{font-size:.85rem;margin:0}
a{color:var(--accent)}
.muted{color:var(--muted);font-size:.78rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;padding:7px 0;border-radius:8px;border:1px solid var(--line);font:inherit;font-weight:700;color:var(--muted);background:var(--panel)}
.tabs button.on{background:var(--accent);color:var(--panel);border-color:var(--accent)}
.scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.pill{flex:none;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font:inherit;font-weight:700;font-size:.85rem;white-space:nowrap;color:var(--ink)}
.pill small{color:var(--muted);font-weight:400;margin-left:4px}
.pill.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.rgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.rgrid button{padding:6px 0;border-radius:6px;border:1px solid var(--line);background:var(--panel);font:inherit;font-weight:700;font-size:.85rem;color:var(--ink)}
.rgrid button.on{background:var(--accent);color:var(--panel);border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.chip{font-size:.72rem;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.chip.hot{background:var(--hot-soft);color:var(--hot)}
.chip.off{background:none;border:1px solid var(--line);color:var(--muted)}
button.chip{border:0;font:inherit;font-size:.75rem;font-weight:700;padding:3px 10px}
button.chip.off{border:1px solid var(--line)}
.car{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:4px;font-family:var(--f-num);font-weight:700;border:1px solid #9995;font-size:.9rem}
.car.lg{min-width:30px;height:30px;font-size:1.05rem}
.car.xs{min-width:18px;height:18px;font-size:.7rem;border-radius:3px}
.car.me{outline:2px solid var(--me);outline-offset:1px}
.k1{background:#fff;color:#111}.k2{background:#111;color:#fff}.k3{background:#d62828;color:#fff}.k4{background:#1d4ed8;color:#fff}.k5{background:#facc15;color:#111}.k6{background:#15803d;color:#fff}.k7{background:#f97316;color:#111}.k8{background:#ec4899;color:#111}.k9{background:#7e22ce;color:#fff}
.tog{display:flex;align-items:center;gap:8px;font-size:.8rem;font-weight:700;background:none;border:0;padding:0;color:var(--ink);font-family:inherit;text-align:left}
.sw{width:36px;height:20px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--panel);transition:left .15s}
.tog.on .sw{background:var(--accent)}
.tog.on .sw::after{left:18px}
.lines{display:flex;gap:6px;flex-wrap:wrap}
.ln{flex:1 1 0;min-width:0;border:2px solid var(--line);border-radius:8px;padding:6px 3px;background:var(--bg);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--ink)}
.ln.s{border-color:var(--accent);background:var(--accent-soft)}
.ln .cars{display:flex;gap:2px;justify-content:center}
.ltype{font-size:.62rem;font-weight:700;color:var(--panel);background:var(--me);border-radius:3px;padding:0 4px;white-space:nowrap}
.rd{display:flex;flex-direction:column;align-items:center;font-size:.6rem;line-height:1.2;width:38px;text-align:center}
.rd .mk{color:var(--hot);font-weight:700;font-size:.75rem;min-height:1em}
.rd .nm{font-weight:700;word-break:keep-all;overflow-wrap:anywhere;text-decoration:underline dotted;text-underline-offset:2px;cursor:pointer;background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--ink)}
.rd .low{color:var(--warn);font-weight:700}
.stag{font-size:.7rem;font-weight:700;color:var(--accent);min-height:1em}
.hint{font-size:.72rem;color:var(--muted);text-align:center}
.seg{display:flex;border:1px solid var(--accent);border-radius:8px;overflow:hidden}
.seg button{flex:1;padding:6px 0;color:var(--accent);font:inherit;font-weight:700;font-size:.8rem;background:transparent;border:0}
.seg button.on{background:var(--accent);color:var(--panel)}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi div{border-left:3px solid var(--accent);padding:2px 8px}
.kpi div.hot{border-color:var(--hot)}
.kpi b{display:block;font-family:var(--f-num);font-size:1.15rem}
.kpi span{font-size:.7rem;color:var(--muted)}
.pat{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px solid var(--line)}
.pat:first-of-type{border-top:0}
.pat .top{display:flex;align-items:center;gap:8px}
.combo{display:inline-flex;align-items:center;gap:2px}
.combo i{font-style:normal;color:var(--muted)}
.pat .num{margin-left:auto;text-align:right;font-family:var(--f-num);font-size:.8rem;line-height:1.3}
.pat .num b{font-size:.95rem}
.pat .txt{font-size:.78rem}
.lk{font-size:.72rem}
.lk a{margin-right:8px;font-weight:700}
.hot-t{color:var(--hot)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.78rem}
th,td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
th{font-size:.66rem;color:var(--muted)}
td.n{text-align:right;font-family:var(--f-num)}
tr.bk td{background:var(--accent-soft);font-weight:700}
.up{color:var(--accent);font-weight:700}.down{color:var(--hot);font-weight:700}
/* 車番＋印＋S/B */
.cm{display:inline-flex;flex-direction:column;align-items:center;width:20px}
.cm .t{font-size:.6rem;line-height:1.1;min-height:.7rem;color:var(--hot);font-weight:700}
.cm .sb{font-size:.56rem;line-height:1.15;min-height:.7rem;font-weight:700;color:var(--panel);background:var(--accent);border-radius:2px;padding:0 2px}
.cm .sb.b{background:var(--warn)}
.cm .sb:empty{background:none}
.gap{width:6px;display:inline-block}
.hist{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:7px 0;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hd{font-weight:700;font-size:.8rem}
.hd small{color:var(--muted);font-weight:400;margin-left:6px}
.hl{display:flex;align-items:flex-end;flex-wrap:wrap}
.hr{grid-row:1 / span 2;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:2px;font-family:var(--f-num);font-size:.8rem}
.vlink{font-size:.72rem;font-weight:700}
.rank{font-family:var(--f-num);font-weight:700;font-size:1.05rem;text-align:center}
select,input[type=search]{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 6px;max-width:100%}
input[type=search]{width:100%;padding:8px 10px;font-size:16px}
.frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 8px}
.frow label{display:flex;flex-direction:column;gap:2px;font-size:.68rem;color:var(--muted);font-weight:700}
.frow select{width:100%}
.empty{padding:20px;text-align:center;color:var(--muted)}
.grade{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:6px;background:var(--warn);color:var(--panel);font-weight:700;font-family:var(--f-num)}
.grade.off{background:var(--line);color:var(--muted)}
.memo{background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:8px;font-size:.8rem;white-space:pre-wrap}
.btn{display:inline-block;font-size:.78rem;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:4px 10px;text-decoration:none;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;text-align:center}
.stats div{background:var(--bg);border-radius:6px;padding:3px 0}
.stats b{display:block;font-family:var(--f-num);font-size:.9rem}
.stats span{font-size:.6rem;color:var(--muted)}
.vgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.vgrid button{border:1px solid var(--line);border-radius:6px;padding:5px 0;font:inherit;font-weight:700;font-size:.8rem;background:var(--panel);color:var(--ink)}
.vgrid button.on{background:var(--accent);color:var(--panel);border-color:var(--accent)}
.vgrid small{display:block;font-size:.6rem;color:var(--muted);font-weight:400}
.vgrid button.on small{color:var(--panel)}
.vhead{font-size:.7rem;color:var(--muted);font-weight:700;margin-top:4px}
.rlist .r{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;font:inherit;color:var(--ink);text-align:left}
.rlist .r:first-child{border-top:0}
.rlist .nm{font-weight:700}
.rlist .meta{color:var(--muted);font-size:.7rem}
.rlist .right{margin-left:auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
/* 下から出る選手画面 */
.sheet-bg{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;border-radius:14px 14px 0 0;padding:10px max(14px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.sheet .bar{display:flex;align-items:center;gap:8px}
.sheet .close{margin-left:auto;background:none;border:0;font:inherit;font-size:1.4rem;color:var(--muted);padding:0 4px;cursor:pointer}
.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.bottom div{max-width:480px;flex:1;display:flex}
.bottom a{flex:1;text-align:center;padding:12px 0;font-weight:700;color:var(--muted);font-size:.85rem;text-decoration:none}
.bottom a.on{color:var(--accent)}
section[hidden]{display:none!important}
.lcol,.rcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.rd .pf{color:var(--muted)}
.rd .pf.loc{color:var(--accent);font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;min-height:1em}
.tag{font-size:.6rem;font-weight:700;border-radius:3px;padding:0 4px;border:1px solid var(--accent);color:var(--accent);white-space:nowrap}
.tag.w{border-color:var(--warn);color:var(--warn)}
.card.pcbar{flex-direction:row;flex-wrap:wrap;gap:6px;align-items:center}
.pcbar input,.manual input,.manual select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.manual{display:flex;flex-direction:column;gap:6px}
.manual .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn.fill{background:var(--accent);color:var(--panel)}
button.btn{background:var(--panel);font-family:inherit;cursor:pointer}
button.btn.fill{background:var(--accent)}
@media (min-width:900px){
  .phone{max-width:1180px}
  #today:not([hidden]){display:grid;grid-template-columns:430px minmax(0,1fr);gap:14px;align-items:start}
  .rcol:empty{display:none}
  .bottom div{max-width:1180px}
  .sheet{max-width:680px;border-radius:14px 14px 0 0}
}
section{display:flex;flex-direction:column;gap:10px}
</style>
</head>
<body>
<div class="phone">
  <header><h1>F1ライン分析</h1><span class="muted" id="upd"></span></header>

  <section id="today">
    <div class="lcol">
      <div class="card pcbar" id="pcbar" hidden></div>
      <div class="tabs" id="days"></div>
      <div class="scroll" id="venues"></div>
      <div class="rgrid" id="races"></div>
      <div id="race"></div>
      <div class="card manual" id="manual" hidden></div>
    </div>
    <div class="rcol" id="rr"></div>
  </section>

  <section id="trend" hidden>
    <div class="card">
      <div class="frow" id="tr-f"></div>
      <div class="muted" id="tr-sum"></div>
    </div>
    <div id="tr-body"></div>
  </section>

  <section id="venue" hidden>
    <div class="card" id="vn-pick"></div>
    <div id="vn-body"></div>
  </section>

  <section id="riders" hidden>
    <div class="card">
      <input type="search" id="rq" placeholder="名前で検索（例：山田）" autocomplete="off">
      <div class="chips" id="rf"></div>
      <div class="rlist" id="rlist"></div>
      <div class="muted" id="rmore"></div>
    </div>
  </section>
</div>
<div id="sheet"></div>
<nav class="bottom"><div><a href="#today">当日予想</a><a href="#trend">傾向</a><a href="#venue">競輪場</a><a href="#riders">選手</a></div></nav>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const yen=v=>v==null?"—":Number(v).toLocaleString()+"円";
const pc=v=>v==null||isNaN(v)?"—":Math.round(v)+"%";
const car=(c,sz="",me=false)=>`<span class="car ${sz} k${c}${me?" me":""}">${c}</span>`;
const comboHTML=(s,sz="lg")=>s?`<span class="combo">${String(s).split("-").map(c=>car(c,sz)).join("<i>-</i>")}</span>`:"";
const pct=(a,b)=>b?100*a/b:null;
const med=xs=>{xs=xs.filter(x=>x).sort((a,b)=>a-b);if(!xs.length)return null;const m=xs.length>>1;return xs.length%2?xs[m]:Math.round((xs[m-1]+xs[m])/2)};
const avg=xs=>{xs=xs.filter(x=>x);return xs.length?Math.round(xs.reduce((a,b)=>a+b,0)/xs.length):null};
const store={get(k,d){try{return JSON.parse(localStorage.getItem("f1:"+k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem("f1:"+k,JSON.stringify(v))}catch(e){}}};
async function getJSON(u,bust=true){const r=await fetch(bust?u+(u.includes("?")?"&":"?")+"t="+Date.now():u);if(!r.ok)throw new Error(r.status);return r.json()}
const GRADES=["S","A","B","C","D","E"];

let META=null,DAYS={},TREND=null,RIDERS=null,NOTES={venues:{},riders:{}};
const st={day:0,venue:0,race:0,s:"n",same:store.get("same",true),scope:null};

/* ---------- 共通：並び（印・S/B付き） ---------- */
// x = [text, cat, url, video, L, marks, sCar, bCar, combo, tri]
function linesWithSB(L,m,s,b,me){return L.map(g=>g.map(c=>`<span class="cm"><span class="t">${esc(m[c]||m[String(c)]||"")}</span>${car(c,"xs",me===c)}<span class="sb${b===c?" b":""}">${s===c&&b===c?"SB":s===c?"S":b===c?"B":""}</span></span>`).join("")).join('<span class="gap"></span>')}
function histRow(x,extra=""){return `<div class="hrow"><div class="hd"><a href="${x[2]}" target="_blank" rel="noopener">${esc(x[0])}</a><small>${esc(x[1])}</small></div>
  <div class="hl">${linesWithSB(x[4],x[5],x[6],x[7])}</div>
  <div class="hr">${comboHTML(x[8],"xs")}<b class="${x[9]>=10000?"hot-t":""}">${yen(x[9])}</b><a class="vlink" href="${x[3]}" target="_blank" rel="noopener">映像</a>${extra}</div></div>`}

/* ---------- メモ ---------- */
async function loadNotes(){
  try{NOTES=await getJSON(`https://raw.githubusercontent.com/${META.repo}/main/notes/notes.json`)}
  catch(e){try{NOTES=await getJSON("data/notes.json")}catch(e2){}}
  NOTES.venues=NOTES.venues||{};NOTES.riders=NOTES.riders||{};}
function editURL(kind,name,template){const path=`notes/${kind}/${name}.md`;const has=kind==="venues"?(name in NOTES.venues):(name in NOTES.riders);
  return has?`https://github.com/${META.repo}/edit/main/${encodeURI(path)}`:`https://github.com/${META.repo}/new/main/notes/${kind}?filename=${encodeURIComponent(name+".md")}&value=${encodeURIComponent(template)}`}
const gradeHTML=g=>g?`<span class="grade">${g}</span>`:`<span class="grade off">—</span>`;

/* ---------- 画面切替 ---------- */
const VIEWS=["today","trend","venue","riders"];
function route(){const h=location.hash.slice(1);const v=VIEWS.includes(h)?h:"today";
  VIEWS.forEach(x=>$("#"+x).hidden=x!==v);
  document.querySelectorAll(".bottom a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+v));
  if(v==="trend")showTrend(); if(v==="venue")showVenue(); if(v==="riders")showRiders(); window.scrollTo(0,0);}
addEventListener("hashchange",route);

/* ---------- 当日予想 ---------- */
async function loadDay(i){const d=META.days[i];if(!DAYS[d])DAYS[d]=await getJSON(`data/day-${d}.json`);return DAYS[d]}
function dayLabel(d,i){const [y,m,dd]=d.split("-");return `${i===0?"今日":i===1?"明日":""} ${+m}/${+dd}`}
async function showToday(){
  $("#days").innerHTML=META.days.map((d,i)=>`<button class="${i===st.day?"on":""}" data-i="${i}">${dayLabel(d,i)}</button>`).join("");
  $("#rr").innerHTML="";
  if(META.pc&&!DAYS[META.days[st.day]])$("#race").innerHTML=`<div class="card empty">読み込み中…（このPCで分析するときは1〜3分かかります）</div>`;
  let D;try{D=await loadDay(st.day)}catch(e){$("#race").innerHTML=`<div class="card empty">データを読み込めませんでした</div>`;return}
  if(!D.venues.length){$("#venues").innerHTML="";$("#races").innerHTML="";$("#manual").hidden=true;$("#race").innerHTML=`<div class="card empty">この日のF1開催はありません（または出走表がまだ出ていません）</div>`;return}
  if(st.venue>=D.venues.length)st.venue=0;
  $("#venues").innerHTML=D.venues.map((v,i)=>`<button class="pill ${i===st.venue?"on":""}" data-i="${i}">${esc(v.venue)}<small>${v.bank.replace("m","")}</small></button>`).join("");
  const V=D.venues[st.venue];
  if(st.race>=V.races.length)st.race=0;
  $("#races").innerHTML=V.races.map((r,i)=>`<button class="${i===st.race?"on":""}" data-i="${i}">${r.no}R</button>`).join("");
  showRace(D,V,st.manual||V.races[st.race]);
  if(META.pc)showManual(D,V,V.races[st.race]);
  store.set("pos",{day:META.days[st.day],venue:V.venue,race:st.race});
}
$("#days").onclick=e=>{const b=e.target.closest("button");if(!b)return;st.day=+b.dataset.i;st.venue=0;st.race=0;st.s="n";st.scope=null;st.manual=null;showToday()};
$("#venues").onclick=e=>{const b=e.target.closest("button");if(!b)return;st.venue=+b.dataset.i;st.race=0;st.s="n";st.scope=null;st.manual=null;showToday()};
$("#races").onclick=e=>{const b=e.target.closest("button");if(!b)return;st.race=+b.dataset.i;st.s="n";st.scope=null;st.manual=null;showToday()};

function showRace(D,V,R){
  const RD=Object.fromEntries(R.riders.map(r=>[r.car,r]));
  const scores=R.riders.map(r=>r.score).filter(Boolean);const low=scores.length?Math.min(...scores):null;
  const shape=R.lines.map(l=>l.length).sort((a,b)=>b-a).join("-");
  const sIdx=st.s==="n"?null:+st.s;
  let h=`<div class="card">

  const res=R.res[st.s+(st.same?"":"a")]||R.res[st.same?"n":"na"];

  const k=a.kimarite||{};
  h+=`<div class="kpi">

  const head=h;h="";
  const ref=id=>D.refs[id];

  h+=`<div class="card"><h2>万車券になったときの着順</h2>${a.manken_tri.length?patRows(a.manken_tri,true):`<div class="muted">万車券はありませんでした</div>`}</div>`;
  h+=`<div class="card"><div style="display:flex;align-items:baseline;gap:8px"><h2>該当レース（直近${a.races.length}レース）</h2><span class="muted" style="margin-left:auto">新しい順</span></div>
    <div class="muted">車番の上＝予想印、下＝S・B</div>

  $("#race").innerHTML=head;$("#rr").innerHTML=h;bindRace(D,V,R);

function bindRace(D,V,R){
  document.querySelectorAll("#race .ln").forEach(b=>b.onclick=e=>{if(e.target.closest(".nm"))return;const i=b.dataset.i;st.s=st.s===i?"n":i;showRace(D,V,R)});

  document.querySelectorAll("#race .seg button").forEach(b=>b.onclick=()=>{st.scope=b.dataset.k;showRace(D,V,R)});
  const t=$("#tog-same");if(t)t.onclick=()=>{st.same=!st.same;store.set("same",st.same);showRace(D,V,R)};

/* ---------- 選手画面 ---------- */

  if(st7)h+=`<div class="stats"><div><b>${p.score??"—"}</b><span>得点</span></div>${["S","H","B","逃","捲","差","マ"].map((l,i)=>`<div><b>${st7[i]??"—"}</b><span>${l}</span></div>`).join("")}</div>`;
  h+=`<div class="chips"><span class="muted">S評価</span>${gradeHTML(n.grade)}${p.type?`<span class="chip">${esc(p.type)}</span>`:""}<a class="btn" style="margin-left:auto" href="${editURL("riders",key,tmpl)}" target="_blank" rel="noopener">書き込む</a></div>`;
  if(n.memo)h+=`<div class="memo">${esc(n.memo)}</div>`;

  else h+=`<div class="hist">${data.races.map(x=>{const r=x.race;return `<div class="hrow"><div class="hd"><a href="${r[2]}" target="_blank" rel="noopener">${esc(r[0])}</a><small>${esc(r[1])}</small></div>
      <div class="hl">${linesWithSB(r[4],r[5],r[6],r[7],x.car)}</div>
      <div class="hr"><span class="rank ${(+x.rank)>=4||!(+x.rank)?"hot-t":""}">${esc(x.rank||"—")}${+x.rank?"着":""}</span>${comboHTML(r[8],"xs")}<span class="${r[9]>=10000?"hot-t":""}">${yen(r[9])}</span><a class="vlink" href="${r[3]}" target="_blank" rel="noopener">映像</a></div></div>`}).join("")}</div>
      <div class="muted">紫の枠＝この選手。車番の上＝予想印、下＝S・B</div>`;
  $("#sheet .sheet").innerHTML=h;bindSheet();

function bindSheet(){const bg=$("#sheet .sheet-bg");if(!bg)return;

/* ---------- 傾向（ページ側で集計） ---------- */
async function loadTrend(){if(!TREND){TREND=await getJSON("data/trend.json");TREND.ix=Object.fromEntries(TREND.cols.map((c,i)=>[c,i]));TREND.lix=Object.fromEntries(TREND.lcols.map((c,i)=>[c,i]));TREND.rows.forEach((r,i)=>r.__i=i)}return TREND}
const bankOf=v=>TREND.bank333.includes(v)?"333m":TREND.bank500.includes(v)?"500m":"400m";
function filterRows(f){const I=TREND.ix;return TREND.rows.filter(r=>{
  if(r[I.n]!==7)return false;
  if(f.cls==="男子"?(r[I.cls]==="ガールズ"):(f.cls&&r[I.cls]!==f.cls))return false;
  if(f.bank&&f.bank!=="すべて"&&r[I.bank]!==f.bank)return false;
  if(f.venue&&f.venue!=="すべて"&&r[I.venue]!==f.venue)return false;
  if(f.type&&f.type!=="すべて"&&r[I.type]!==f.type)return false;
  if(f.cat&&f.cat!=="すべて"&&r[I.cat]!==f.cat)return false;
  if(f.lead&&f.lead!=="すべて"&&r[I.s_lead]!==f.lead)return false;
  return true})}
function groupBy(rows,fn){const g=new Map();for(const r of rows){const k=fn(r);if(k==null)continue;if(!g.has(k))g.set(k,[]);g.get(k).push(r)}return g}
function computeStats(rows){const I=TREND.ix;const n=rows.length;
  const sum={n,man:pct(rows.filter(r=>r[I.man]).length,n),tri:med(rows.map(r=>r[I.tri]))};
  const sRows=rows.filter(r=>r[I.s]);
  const s_table=[...groupBy(sRows,r=>r[I.type]+"|"+r[I.s])].map(([k,v])=>({type:k.split("|")[0],s:k.split("|")[1],n:v.length,win:pct(v.filter(r=>r[I.s_win]).length,v.length),top3:pct(v.filter(r=>r[I.s_top3]).length,v.length),tsu:pct(v.filter(r=>r[I.tsu]).length,v.length),man:pct(v.filter(r=>r[I.man]).length,v.length),tri:med(v.map(r=>r[I.tri]))})).filter(x=>x.n>=5).sort((a,b)=>TREND.types.indexOf(a.type)-TREND.types.indexOf(b.type)||b.n-a.n);
  const mk=key=>{const v=rows.filter(r=>r[I[key]]);const m=v.length;if(!m)return null;const dead=v.filter(r=>!r[I[key]][2]);return {n:m,win:pct(v.filter(r=>r[I[key]][0]).length,m),top2:pct(v.filter(r=>r[I[key]][1]).length,m),top3:pct(v.filter(r=>r[I[key]][2]).length,m),dead:pct(dead.length,m),deadTri:avg(dead.map(r=>r[I.tri]))}};
  const hs=rows.filter(r=>r[I.hon]&&r[I.s]);
  const hon_by_s=[...groupBy(hs,r=>r[I.hon][3]?"◎ラインがS":"◎ライン以外がS")].sort().map(([k,v])=>({k,n:v.length,win:pct(v.filter(r=>r[I.hon][0]).length,v.length),top3:pct(v.filter(r=>r[I.hon][2]).length,v.length),man:pct(v.filter(r=>r[I.man]).length,v.length),tri:med(v.map(r=>r[I.tri]))}));
  const low=[...groupBy(rows.filter(r=>r[I.low]),r=>r[I.low][0])].map(([k,v])=>{const hit=v.filter(r=>r[I.low][1]<=3);return {k,n:v.length,win:pct(v.filter(r=>r[I.low][1]===1).length,v.length),top3:pct(hit.length,v.length),tri:avg(hit.map(r=>r[I.tri]))}}).filter(x=>x.n>=5).sort((a,b)=>b.n-a.n);
  const kim=[...groupBy(rows.filter(r=>r[I.kim]),r=>r[I.type])].map(([k,v])=>({k,n:v.length,...Object.fromEntries(["逃","捲","差","マ"].map(x=>[x,pct(v.filter(r=>r[I.kim]===x).length,v.length)]))})).sort((a,b)=>TREND.types.indexOf(a.k)-TREND.types.indexOf(b.k));
  const lead=[...groupBy(rows.filter(r=>r[I.s_lead]),r=>r[I.s_lead])].map(([k,v])=>({k,n:v.length,win:pct(v.filter(r=>r[I.s_win]).length,v.length),top3:pct(v.filter(r=>r[I.s_top3]).length,v.length),tsu:pct(v.filter(r=>r[I.tsu]).length,v.length),man:pct(v.filter(r=>r[I.man]).length,v.length)})).sort((a,b)=>TREND.leaders.indexOf(a.k)-TREND.leaders.indexOf(b.k));
  const bycat=[...groupBy(rows,r=>r[I.cat]+"|"+r[I.type])].map(([k,v])=>({cat:k.split("|")[0],type:k.split("|")[1],n:v.length,tsu:pct(v.filter(r=>r[I.tsu]).length,v.length),man:pct(v.filter(r=>r[I.man]).length,v.length),tri:med(v.map(r=>r[I.tri]))})).filter(x=>x.n>=5).sort((a,b)=>TREND.categories.indexOf(a.cat)-TREND.categories.indexOf(b.cat)||b.n-a.n);
  const ids=new Set(rows.map(r=>r.__i));const L=TREND.lix;const lr=TREND.lrows.filter(l=>ids.has(l[L.race]));
  const feat=src=>[["同県あり","same",1],["同県なし","same",0],["地元あり","local",1],["地元なし","local",0],["番手が自力","jiriki",1],["番手が自力でない","jiriki",0]].map(([k,f,v])=>{const g=src.filter(l=>l[L[f]]===v);const m=g.length;
    return {k,n:m,win:pct(g.filter(l=>l[L.win]).length,m),top3:pct(g.filter(l=>l[L.top3]).length,m),l12:pct(g.filter(l=>l[L.l12]).length,m),bwin:pct(g.filter(l=>l[L.bwin]).length,m)}}).filter(r=>r.n>=5);
  return {sum,s_table,hon:mk("hon"),tai:mk("tai"),hon_by_s,low,kim,lead,bycat,feat:{all:feat(lr),s:feat(lr.filter(l=>l[L.s]))}};}
const tbl=(head,rows)=>`<div class="tw"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows.join("")||`<tr><td class="muted" colspan="${head.length}">5件以上ある組み合わせがありません</td></tr>`}</tbody></table></div>`;
const trow=(label,cells)=>`<tr>${label.map(x=>`<td>${x}</td>`).join("")}${cells.map(c=>`<td class="n">${c}</td>`).join("")}</tr>`;
function statsHTML(S){
  let h=`<div class="card"><h2>Sを取ったラインと結果</h2>${tbl(["区分","Sライン","件数","1着","3着内","S→主導権","万車券","3連単中央値"],S.s_table.map(r=>trow([esc(r.type),esc(r.s)],[r.n,pc(r.win),pc(r.top3),pc(r.tsu),pc(r.man),yen(r.tri)])))}</div>`;
  h+=`<div class="card"><h2>Sラインの先頭タイプ</h2>${tbl(["先頭タイプ","件数","Sライン1着","3着内","S→主導権","万車券"],S.lead.map(r=>trow([esc(r.k)],[r.n,pc(r.win),pc(r.top3),pc(r.tsu),pc(r.man)])))}<div class="muted">netkeirinの直近4か月のH・B回数から判定。値を取り込み済みのレースだけが対象です</div></div>`;
  h+=`<div class="card"><h2>予想印 ◎・○ のライン</h2>${tbl(["","件数","1着","2着内","3着内","全員4着以下","その時の3連単平均"],[["◎ライン",S.hon],["○ライン",S.tai]].filter(x=>x[1]).map(([k,v])=>trow([k],[v.n,pc(v.win),pc(v.top2),pc(v.top3),pc(v.dead),yen(v.deadTri)])))}
    ${tbl(["◎ラインとS","件数","◎ライン1着","3着内","万車券","3連単中央値"],S.hon_by_s.map(r=>trow([r.k],[r.n,pc(r.win),pc(r.top3),pc(r.man),yen(r.tri)])))}</div>`;
  h+=`<div class="card"><h2>ラインの特徴別の成績（2車以上のライン）</h2>${tbl(["特徴","ライン数","1着","3着内","ライン1-2","番手1着"],S.feat.all.map(r=>trow([r.k],[r.n,pc(r.win),pc(r.top3),pc(r.l12),pc(r.bwin)])))}
    <h3>Sを取ったラインだけ</h3>${tbl(["特徴","ライン数","1着","3着内","ライン1-2","番手1着"],S.feat.s.map(r=>trow([r.k],[r.n,pc(r.win),pc(r.top3),pc(r.l12),pc(r.bwin)])))}
    <div class="muted">ライン1-2＝そのラインで1・2着。番手1着＝番手の選手が1着。同県・地元・番手自力は netkeirin の府県・H・B回数を取り込み済みのレースが対象</div></div>`;
  h+=`<div class="card"><h2>競走得点が一番低い選手の着順</h2>${tbl(["位置","件数","1着","3着内","3着内時の3連単平均"],S.low.map(r=>trow([esc(r.k)],[r.n,pc(r.win),pc(r.top3),yen(r.tri)])))}</div>`;
  h+=`<div class="card"><h2>決まり手（1着）</h2>${tbl(["区分","件数","逃","捲","差","マ"],S.kim.map(r=>trow([esc(r.k)],[r.n,pc(r["逃"]),pc(r["捲"]),pc(r["差"]),pc(r["マ"])])))}</div>`;
  h+=`<div class="card"><h2>種別 × ライン区分</h2>${tbl(["種別","区分","件数","S→主導権","万車券","3連単中央値"],S.bycat.map(r=>trow([esc(r.cat),esc(r.type)],[r.n,pc(r.tsu),pc(r.man),yen(r.tri)])))}</div>`;
  return h;}
function sel(id,label,opts,val){return `<label>${label}<select id="${id}">${["すべて",...opts].map(o=>`<option${o===val?" selected":""}>${esc(o)}</option>`).join("")}</select></label>`}
async function showTrend(){
  if(!TREND){$("#tr-body").innerHTML=`<div class="card empty">読み込み中…</div>`;await loadTrend()}
  const f=store.get("trendf",{bank:"すべて",venue:"すべて",cls:"男子",type:"すべて",cat:"すべて",lead:"すべて"});
  const vs=TREND.venues.filter(v=>f.bank==="すべて"||bankOf(v)===f.bank);if(!vs.includes(f.venue))f.venue="すべて";
  $("#tr-f").innerHTML=sel("f-bank","周長",TREND.banks,f.bank)+sel("f-venue","競輪場",vs,f.venue)
    +`<label>級<select id="f-cls">${["男子","S級","A級","チャレンジ"].map(o=>`<option${o===f.cls?" selected":""}>${o}</option>`).join("")}</select></label>`
    +sel("f-type","ライン構造",TREND.types,f.type)+sel("f-cat","レース種別",TREND.categories,f.cat)+sel("f-lead","Sラインの先頭",TREND.leaders,f.lead);
  $("#tr-f").onchange=e=>{const g={bank:$("#f-bank").value,venue:$("#f-venue").value,cls:$("#f-cls").value,type:$("#f-type").value,cat:$("#f-cat").value,lead:$("#f-lead").value};if(e.target.id==="f-bank")g.venue="すべて";store.set("trendf",g);showTrend()};
  const rows=filterRows(f);const S=computeStats(rows);
  $("#tr-sum").textContent=`${S.sum.n.toLocaleString()}レース（7車立て）　万車券率 ${pc(S.sum.man)}　3連単中央値 ${yen(S.sum.tri)}`;
  $("#tr-body").innerHTML=S.sum.n?statsHTML(S):`<div class="card empty">条件に合うレースがありません</div>`;}

/* ---------- 競輪場 ---------- */
function venueMetrics(rows){const I=TREND.ix;const n=rows.length;const s=rows.filter(r=>r[I.s]);
  return {n,s_top3:pct(s.filter(r=>r[I.s_top3]).length,s.length),s_win:pct(s.filter(r=>r[I.s_win]).length,s.length),tsu:pct(s.filter(r=>r[I.tsu]).length,s.length),
    nige:pct(rows.filter(r=>r[I.kim]==="逃").length,n),makuri:pct(rows.filter(r=>r[I.kim]==="捲").length,n),sashi:pct(rows.filter(r=>r[I.kim]==="差").length,n),
    hon:pct(rows.filter(r=>r[I.hon]&&r[I.hon][0]).length,n),man:pct(rows.filter(r=>r[I.man]).length,n),tri:med(rows.map(r=>r[I.tri]))}}
async function showVenue(){
  if(!TREND){$("#vn-body").innerHTML=`<div class="card empty">読み込み中…</div>`;await loadTrend()}
  const cur=store.get("venue",null);const cls=store.get("vcls","男子");
  $("#vn-pick").innerHTML=`<h2>競輪場を選ぶ</h2>`+TREND.banks.map(b=>`<div class="vhead">${b}</div><div class="vgrid">${TREND.venues.filter(v=>bankOf(v)===b).map(v=>`<button class="${v===cur?"on":""}" data-v="${esc(v)}">${esc(v)}</button>`).join("")}</div>`).join("");
  $("#vn-pick").onclick=e=>{const b=e.target.closest("button[data-v]");if(!b)return;store.set("venue",b.dataset.v);showVenue();setTimeout(()=>$("#vn-body").scrollIntoView({behavior:"smooth"}),50)};
  if(!cur){$("#vn-body").innerHTML="";return}
  const bank=bankOf(cur);const base={cls};
  const vr=filterRows({...base,venue:cur}),br=filterRows({...base,bank});
  const V=venueMetrics(vr),B=venueMetrics(br);
  const memo=NOTES.venues[cur];
  const cmp=(label,k,fmt=pc)=>{const d=(V[k]!=null&&B[k]!=null&&fmt===pc)?V[k]-B[k]:0;return `<tr><td>${label}</td><td class="n"><span class="${Math.abs(d)>=8?(d>0?"up":"down"):""}">${fmt(V[k])}</span></td><td class="n">${fmt(B[k])}</td></tr>`};
  let h=`<div class="card"><div class="chips"><h2>${esc(cur)}</h2><span class="chip">${bank}</span><a class="btn" style="margin-left:auto" href="${editURL("venues",cur,`# ${cur}\n`)}" target="_blank" rel="noopener">特徴を書き込む</a></div>
    ${memo?`<div class="memo">${esc(memo)}</div>`:`<div class="muted">まだ特徴が書かれていません</div>`}
    <label class="muted">級 <select id="vn-cls">${["男子","S級","A級","チャレンジ"].map(o=>`<option${o===cls?" selected":""}>${o}</option>`).join("")}</select></label>
    <div class="tw"><table><thead><tr><th></th><th>${esc(cur)}（${V.n}）</th><th>${bank}平均（${B.n}）</th></tr></thead><tbody>
    ${cmp("Sライン3着内","s_top3")}${cmp("Sライン1着","s_win")}${cmp("Sラインが主導権","tsu")}${cmp("逃げ","nige")}${cmp("捲り","makuri")}${cmp("差し","sashi")}${cmp("◎ライン1着","hon")}${cmp("万車券率","man")}${cmp("3連単中央値","tri",yen)}
    </tbody></table></div><div class="muted">7車立て。周長の平均との差が±8ポイント以上で色付け${V.n<30?"。この場はまだ件数が少ないので参考値です":""}</div></div>`;
  h+=vr.length?statsHTML(computeStats(vr)):"";
  $("#vn-body").innerHTML=h;
  $("#vn-cls").onchange=e=>{store.set("vcls",e.target.value);showVenue()};}

/* ---------- 選手 ---------- */
let RF=store.get("rf","today");
async function todayRiders(){const m=new Map();for(let i=0;i<META.days.length;i++){let D;try{D=await loadDay(i)}catch(e){continue}
  for(const v of D.venues)for(const r of v.races)for(const x of r.riders){if(!m.has(x.key))m.set(x.key,{...x,where:`${dayLabel(META.days[i],i).trim()} ${v.venue}${r.no}R`})}}return m}
async function showRiders(){
  if(!RIDERS){$("#rlist").innerHTML=`<div class="empty">読み込み中…</div>`;try{RIDERS=await getJSON("data/riders.json")}catch(e){RIDERS=[]}}
  $("#rf").innerHTML=[["today","今日・明日の出走"],["noted","書き込み済み"],["all","すべて"]].map(([k,l])=>`<button class="chip ${RF===k?"":"off"}" data-k="${k}">${l}</button>`).join("");
  const q=$("#rq").value.trim().replace(/\s/g,"");
  const tr=await todayRiders();
  let list;
  if(RF==="today")list=[...tr.values()].map(x=>({key:x.key,name:x.name,pref:x.pref,term:x.term,klass:x.klass,type:x.type,where:x.where,car:x.car,today:x}));
  else list=RIDERS.map(r=>({key:r[0],name:r[1],pref:r[2],term:r[3],klass:r[4],type:r[6],where:tr.get(r[0])?.where}));
  if(RF==="noted")list=list.filter(x=>NOTES.riders[x.key]);
  if(q)list=list.filter(x=>(x.name||"").replace(/\s/g,"").includes(q));
  const total=list.length;list=list.slice(0,100);
  $("#rlist").innerHTML=list.map(x=>{const n=NOTES.riders[x.key]||{};return `<button class="r" data-key="${esc(x.key)}">${x.car?car(x.car):""}<div><div class="nm">${esc(x.name)}</div><div class="meta">${[x.pref,x.term?x.term+"期":"",x.klass,x.type,x.where].filter(Boolean).map(esc).join(" ")}</div></div><div class="right">${gradeHTML(n.grade)}<span class="meta">${n.memo?"メモあり":"未記入"}</span></div></button>`}).join("")||`<div class="empty">見つかりません</div>`;
  $("#rmore").textContent=total>100?`ほか${total-100}人。名前で絞り込んでください`:"";
  $("#rlist").onclick=e=>{const b=e.target.closest(".r");if(!b)return;const t=tr.get(b.dataset.key);openRider(b.dataset.key,t)};
  $("#rf").onclick=e=>{const b=e.target.closest("button");if(!b)return;RF=b.dataset.k;store.set("rf",RF);showRiders()};
}
let qt=null;$("#rq").oninput=()=>{clearTimeout(qt);qt=setTimeout(showRiders,200)};

/* ---------- 起動 ---------- */
(async()=>{
  try{META=await getJSON("data/meta.json")}catch(e){$("#race").innerHTML=`<div class="card empty">まだページが作られていません</div>`;return}
  $("#upd").textContent=META.pc?`PC版・${(META.count||0).toLocaleString()}レース（${META.last||""}まで）`:`${META.updated} 更新・${META.count.toLocaleString()}レース`;
  await loadNotes();
  if(META.pc){document.title="F1ライン分析（PC）";showPcBar()}
  const pos=store.get("pos",null);
  if(pos){const di=META.days.indexOf(pos.day);if(di>=0){st.day=di;try{const D=await loadDay(di);const vi=D.venues.findIndex(v=>v.venue===pos.venue);if(vi>=0){st.venue=vi;st.race=pos.race}}catch(e){}}}
  await showToday();route();
})();
</script>
